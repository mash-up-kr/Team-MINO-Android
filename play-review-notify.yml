# yaml-language-server: $schema=https://raw.githubusercontent.com/JaesungLeee/google-play-review-notify/main/schemas/config.schema.json
# Generated by `play-review-notify init`. Secrets are referenced as ${ENV_VAR}; never write real values here.
version: 1

apps:
  - packageName: com.mino.gguk
    name: "GGUK - 가고 싶던 곳이 다시 떠오르게, 꾹"
    tracks: [production]

sources:
  playApi:
    # PENDING_SUBMISSION, SUBMITTED, APPROVED, REJECTED and LIVE from the release lifecycle
    # of each configured track. Setup: https://github.com/JaesungLeee/google-play-review-notify/blob/main/docs/play-api-setup.md
    enabled: true
    serviceAccountJson: ${PLAY_SERVICE_ACCOUNT_JSON}
  email:
    # POLICY_WARNING and the reason text of rejections from Play Console emails. Setup: https://github.com/JaesungLeee/google-play-review-notify/blob/main/docs/gmail-oauth.md
    enabled: true
    auth:
      clientId: ${GMAIL_CLIENT_ID}
      clientSecret: ${GMAIL_CLIENT_SECRET}
      refreshToken: ${GMAIL_REFRESH_TOKEN}
    lookbackHours: 24

# 관리형 게시(Managed publishing)를 켜 두어 APPROVED(게시 준비됨)와 LIVE(게시 버튼 누름)가 다른 시점에 온다.
# 그래서 LIVE를 APPROVED로 합치지 않고 6개 이벤트를 모두 따로 받는다.
events:
  PENDING_SUBMISSION: { enabled: true }
  SUBMITTED: { enabled: true }
  APPROVED: { enabled: true }
  REJECTED: { enabled: true, mentions: ['@here'] }
  LIVE: { enabled: true }
  POLICY_WARNING: { enabled: true }

channels:
  discord:
    type: discord
    webhookUrl: ${DISCORD_WEBHOOK_URL}
defaultChannels: [discord]

stateStore:
  type: github-cache   # persisted in the Actions cache; no files to commit
