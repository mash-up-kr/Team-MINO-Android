# yaml-language-server: $schema=https://raw.githubusercontent.com/JaesungLeee/google-play-review-notify/main/schemas/config.schema.json
# Generated by `play-review-notify init`. Secrets are referenced as ${ENV_VAR}; never write real values here.
version: 1

apps:
  - packageName: com.mino.gguk
    name: "GGUK - 가고 싶던 곳이 다시 떠오르게, 꾹"
    tracks: [production]

sources:
  email:
    # REJECTED and POLICY_WARNING from Play Console emails. Setup: https://github.com/JaesungLeee/google-play-review-notify/blob/main/docs/gmail-oauth.md
    enabled: true
    auth:
      clientId: ${GMAIL_CLIENT_ID}
      clientSecret: ${GMAIL_CLIENT_SECRET}
      refreshToken: ${GMAIL_REFRESH_TOKEN}
    lookbackHours: 24
  playApi:
    # SUBMITTED when a new versionCode appears on a track. Setup: https://github.com/JaesungLeee/google-play-review-notify/blob/main/docs/play-api-setup.md
    enabled: true
    serviceAccountJson: ${PLAY_SERVICE_ACCOUNT_JSON}
  storeListing:
    # LIVE (production track) when the public store page appears or its "Updated on" date changes.
    enabled: true
    locale: ko
    country: KR

events:
  REJECTED: { enabled: true, mentions: ['@here'] }
  LIVE: { enabled: true, mergeInto: APPROVED }
  # SUBMITTED: { enabled: true }        # off by default; needs the playApi source or `emit`
  # UNKNOWN_NOTICE: { enabled: true }   # turn on to see Play emails the rules could not classify

channels:
  discord:
    type: discord
    webhookUrl: ${DISCORD_WEBHOOK_URL}
defaultChannels: [discord]

stateStore:
  type: github-cache   # persisted in the Actions cache; no files to commit
