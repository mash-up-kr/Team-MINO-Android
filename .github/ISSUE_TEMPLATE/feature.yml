name: "개발 작업 티켓"
description: "기능 개발 / 개선 / 리팩토링 / 문서화 등 개발 작업 단위 이슈"
labels: ["feature"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      description: 이 작업의 성격을 선택하세요.
      options:
        - New Feature
        - Improvement
        - Bug Fix
        - Refactoring
        - Chore
        - Docs
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 작업 목표
      description: 이 작업이 완료되면 달성되는 상태를 한두 문장으로 적어주세요.
      placeholder: |
        예) 로그인 API 연동을 완료하여 사용자가 이메일/비밀번호로 로그인할 수 있다.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 상세 설명
      description: 배경·맥락·구현 방향을 정리해주세요.
      placeholder: |
        - 배경:
        - 구현 방향:
        - 고려 사항:
    validations:
      required: true

  - type: textarea
    id: affected-modules
    attributes:
      label: 영향 모듈
      description: 변경이 예상되는 모듈/패키지를 적어주세요.
      placeholder: |
        - :app
        - :core:network
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: PR이 머지되기 전에 충족되어야 하는 조건을 체크리스트로 작성해주세요.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: 관련 링크, 디자인 시안, 외부 문서 등.
      placeholder: |
        - Figma:
        - 관련 이슈: #
    validations:
      required: false
